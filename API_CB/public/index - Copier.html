<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Schenker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" />
</head>
<body class="bg-light">

    <div class="container py-4">
        <!-- Titre principal -->
        <div class="mb-4">
            <h1 class="text-primary">API Schenker</h1>
            <p class="text-muted mb-0">Gestion des BL à envoyer</p>
        </div>

        <!-- Barre d'actions -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="form-check">
                    <input class="form-check-input"
                           type="checkbox"
                           id="checkAllBL" />
                    <label class="form-check-label fw-bold" for="checkAllBL">
                        Cocher / décocher tous les BL
                    </label>
                </div>
            </div>
        </div>

        <!-- Titre de la zone des DIV -->
        <div class="mb-3">
            <h2 class="h4">Liste des BL trouvés</h2>
        </div>

        <!-- Conteneur qui recevra toutes les DIV -->
        <div id="bl-list" class="d-flex flex-column gap-3">

            <!-- DIV modèle / placeholder -->
            <!-- Elle peut rester vide au chargement, le JS va la remplir -->
            <div id="bl-template" class="card shadow-sm d-none">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-1">
                            <div class="form-check">
                                <input class="form-check-input bl-checkbox"
                                       type="checkbox" />
                            </div>
                        </div>

                        <div class="col-md-8">
                            <h5 class="card-title mb-1 bl-number">BL000000</h5>
                            <p class="mb-1">
                                <strong>Client :</strong>
                                <span class="bl-client">Nom du client</span>
                            </p>
                            <p class="mb-1">
                                <strong>Ville :</strong>
                                <span class="bl-city">Ville</span>
                            </p>
                            <p class="mb-0">
                                <strong>Poids :</strong>
                                <span class="bl-weight">0</span> kg
                            </p>
                        </div>

                        <div class="col-md-3 text-md-end mt-3 mt-md-0">
                            <button class="btn btn-outline-primary btn-sm bl-send-btn">
                                Envoyer
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Ton script JS -->
    <script src="api.js"></script>
</body>
</html>
